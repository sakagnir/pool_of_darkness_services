name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: karaoke
          MARIADB_USER: karaoke
          MARIADB_PASSWORD: karaoke
          MARIADB_ROOT_PASSWORD: root

        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
 
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Install dependencies
        working-directory: backend
        run: npm install
 
      - name: Create database schema
        run: |
          mysql \
            -h 127.0.0.1 \
            -u karaoke \
            -pkaraoke \
            karaoke < database/init.sql
 
      - name: Run integration tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: karaoke
          DB_USER: karaoke
          DB_PASSWORD: karaoke
        run: npm test

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add front tag before push
      run: docker tag j5-karaoke-front:${{ github.sha }} sakagnir/j5-karaoke-front:${{ github.sha }}
    
    - name: Add back tag before push
      run: docker tag j5-karaoke-back:${{ github.sha }} sakagnir/j5-karaoke-back:${{ github.sha }}


    - name: Build the front Docker image
      run: docker build . --file Dockerfile --tag j5-karaoke-front:${{ github.sha }}

    - name: Build the back Docker image
      run: docker build . --file Dockerfile --tag j5-karaoke-back:${{github.sha }}


    - uses: docker/login-action@v3
      with: 
        username: sakagnir
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    
    - name: Push front on Docker Hub
      run: docker push sakagnir/j5-karaoke-front:${{ github.sha }}
    
    - name: Push back on Docker Hub
      run: docker push sakagnir/j5-karaoke-back:${{ github.sha }}