name: pool-darkness

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-karaoke}
      MARIADB_DATABASE: ${DB_NAME:-karaoke}
      MARIADB_USER: ${DB_USER:-karaoke}
      MARIADB_PASSWORD: ${DB_PASSWORD:-karaoke}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  karaoke-back:
    build: ./backend
    restart: unless-stopped
    ports:
      # 3000 est occupé par vm-prod (machine cible J3) → on publie sur 3100
      - 3100:3000
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pouls — le battement de cœur vers le tableau de la classe
      TABLEAU_URL: ${TABLEAU_URL:-}
      GROUPE: ${GROUPE:-}
      COULEUR: ${COULEUR:-#888888}
      SERVICE: api
      VERSION: ${VERSION:-dev}
      URL_INTERNE: http://karaoke-back:3000
      # Base de données
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-karaoke}
      DB_PASSWORD: ${DB_PASSWORD:-karaoke}
      DB_NAME: ${DB_NAME:-karaoke}

  karaoke-front:
    build: ./frontend
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      # Pouls — le battement de cœur vers le tableau de la classe
      TABLEAU_URL: ${TABLEAU_URL:-}
      GROUPE: ${GROUPE:-}
      COULEUR: ${COULEUR:-#888888}
      SERVICE: front
      VERSION: ${VERSION:-dev}
      URL_INTERNE: http://karaoke-front:8080

  karaoke-annexe:
    build: ./annexe
    restart: unless-stopped
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pouls — le battement de cœur vers le tableau de la classe
      TABLEAU_URL: ${TABLEAU_URL:-}
      GROUPE: ${GROUPE:-}
      COULEUR: ${COULEUR:-#888888}
      SERVICE: annexe
      VERSION: ${VERSION:-dev}
      URL_INTERNE: http://karaoke-annexe:8000
      # Base de données
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-karaoke}
      DB_PASSWORD: ${DB_PASSWORD:-karaoke}
      DB_NAME: ${DB_NAME:-karaoke}

volumes:
  db-data:

