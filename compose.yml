services:
  karaoke-front:
    build: /frontend/.
    ports:
      - 50:80
    
  karaoke-back:
    build: /backend/.
    ports:
      - 60:50
    env_file:
      - .env
    networks:
      - backend-network
  
  db:
    build: .
    image: mariadb:11
    container_name: karaoke-db
    restart: always

    environment:
      MARIADB_DATABASE: karaoke
      MARIADB_USER: karaoke
      MARIADB_PASSWORD: karaoke
      MARIADB_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mariadb_data: